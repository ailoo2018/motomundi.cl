<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3a3a3e"/>
      <stop offset="0.45" stop-color="#1b1b1e"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4b5c"/>
      <stop offset="0.35" stop-color="#b3001a"/>
      <stop offset="0.7" stop-color="#3a0008"/>
      <stop offset="1" stop-color="#120003"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2a40"/>
      <stop offset="1" stop-color="#a5001a"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e2e32"/>
      <stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55555b"/>
      <stop offset="1" stop-color="#222226"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="floor" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="redglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <path id="sealText" d="M 0 0 m -72 0 a 72 72 0 1 1 144 0 a 72 72 0 1 1 -144 0"/>
  </defs>

  <!-- Red glow behind the gear -->
  <circle cx="470" cy="400" r="260" fill="#d6001c" opacity="0.35" filter="url(#redglow)"/>
  <!-- Floor shadow -->
  <ellipse cx="460" cy="725" rx="400" ry="34" fill="url(#floor)"/>

  <!-- ───────────── JACKET (back left) ───────────── -->
  <g filter="url(#drop)" transform="translate(30 150)">
    <!-- sleeves -->
    <path d="M70 70 L20 120 L0 400 C0 420 40 428 52 410 L80 210 Z" fill="url(#leather)" stroke="#000" stroke-width="2"/>
    <path d="M300 70 L350 120 L370 400 C370 420 330 428 318 410 L290 210 Z" fill="url(#leather)" stroke="#000" stroke-width="2"/>
    <!-- elbow armor -->
    <path d="M14 260 C26 240 64 244 70 268 L62 330 C50 344 20 342 10 326 Z" fill="url(#armor)"/>
    <path d="M356 260 C344 240 306 244 300 268 L308 330 C320 344 350 342 360 326 Z" fill="url(#armor)"/>
    <!-- cuffs -->
    <path d="M2 392 L54 398 L52 416 C40 428 4 424 0 410 Z" fill="#d6001c"/>
    <path d="M368 392 L316 398 L318 416 C330 428 366 424 370 410 Z" fill="#d6001c"/>
    <!-- torso -->
    <path d="M70 70 C110 40 140 30 160 28 L185 60 L210 28 C230 30 260 40 300 70 L310 470 C250 488 120 488 60 470 Z" fill="url(#leather)" stroke="#000" stroke-width="2"/>
    <!-- shoulder panels -->
    <path d="M70 70 C96 52 126 40 150 36 L140 110 C110 118 84 112 68 100 Z" fill="url(#red)"/>
    <path d="M300 70 C274 52 244 40 220 36 L230 110 C260 118 286 112 302 100 Z" fill="url(#red)"/>
    <!-- collar -->
    <path d="M150 20 C160 10 210 10 220 20 L210 46 L185 64 L160 46 Z" fill="#111" stroke="#d6001c" stroke-width="3"/>
    <!-- zipper -->
    <path d="M185 64 L185 482" stroke="#8a8a90" stroke-width="5" stroke-dasharray="4 4"/>
    <!-- chest stripes -->
    <path d="M78 170 L170 150 L172 176 L80 198 Z" fill="#d6001c"/>
    <path d="M292 170 L200 150 L198 176 L290 198 Z" fill="#d6001c"/>
    <path d="M82 206 L172 186 L172 196 L82 216 Z" fill="#fff" opacity="0.85"/>
    <path d="M288 206 L198 186 L198 196 L288 216 Z" fill="#fff" opacity="0.85"/>
    <!-- stretch panels -->
    <path d="M70 300 L66 460 M90 300 L88 470 M300 300 L304 460 M280 300 L282 470" stroke="#3a3a40" stroke-width="3"/>
    <!-- waist band -->
    <path d="M60 450 C120 468 250 468 310 450 L310 472 C250 490 120 490 60 472 Z" fill="#1a1a1c" stroke="#d6001c" stroke-width="2"/>
    <!-- shine -->
    <path d="M110 240 C120 230 140 228 150 236 L140 400 C128 404 116 400 110 392 Z" fill="url(#shine)" opacity="0.18"/>
  </g>

  <!-- ───────────── HELMET (center) ───────────── -->
  <g filter="url(#drop)" transform="translate(210 60)">
    <!-- rear spoiler -->
    <path d="M40 200 C20 210 8 236 12 256 L56 250 Z" fill="#d6001c"/>
    <!-- shell -->
    <path d="M40 330 C10 170 130 40 290 40 C430 40 520 140 528 270 L532 350 C534 392 506 420 466 424 L210 438 C110 444 54 410 40 330 Z" fill="url(#shell)" stroke="#000" stroke-width="3"/>
    <!-- racing stripe -->
    <path d="M70 160 C140 70 260 44 360 60 C430 72 480 110 506 160 L470 168 C440 120 390 96 340 92 C250 84 160 110 112 176 Z" fill="url(#red)"/>
    <path d="M116 186 C166 124 250 104 336 108 C384 112 430 132 462 176 L450 180 C420 142 380 126 334 122 C258 118 180 140 128 196 Z" fill="#fff" opacity="0.9"/>
    <!-- visor opening frame -->
    <path d="M240 200 C330 186 450 196 512 238 C528 280 526 320 510 344 L280 348 C240 348 214 318 220 270 Z" fill="#0a0a0a"/>
    <!-- visor -->
    <path d="M250 212 C334 200 444 210 500 246 C512 282 510 314 498 332 L286 336 C252 336 232 310 236 272 Z" fill="url(#visor)"/>
    <!-- visor reflections -->
    <path d="M270 226 C330 216 400 218 450 232 L440 246 C390 236 330 234 278 242 Z" fill="#fff" opacity="0.45"/>
    <path d="M300 300 L460 296 L456 306 L300 310 Z" fill="#fff" opacity="0.15"/>
    <!-- visor pivot -->
    <circle cx="232" cy="286" r="22" fill="#2a2a2e" stroke="#d6001c" stroke-width="5"/>
    <circle cx="232" cy="286" r="7" fill="#d6001c"/>
    <!-- chin bar -->
    <path d="M300 356 L512 352 C520 380 504 404 470 410 L320 418 C304 404 298 380 300 356 Z" fill="#141416"/>
    <path d="M360 372 L360 404 M384 370 L384 404 M408 368 L408 402 M432 366 L432 400" stroke="#d6001c" stroke-width="6" stroke-linecap="round"/>
    <!-- top vents -->
    <path d="M250 70 L300 62 L302 80 L252 88 Z" fill="#0b0b0c"/>
    <path d="M330 60 L380 62 L378 80 L330 78 Z" fill="#0b0b0c"/>
    <!-- base trim -->
    <path d="M44 340 C60 404 110 436 210 432 L466 418 C500 414 524 396 530 370 L532 384 C528 414 500 436 466 438 L210 452 C104 458 52 420 44 360 Z" fill="#000"/>
    <!-- shell highlight -->
    <path d="M90 240 C110 160 180 100 250 82" stroke="#fff" stroke-opacity="0.35" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- original mark: mm shield -->
    <g transform="translate(120 280)">
      <path d="M0 0 L60 0 L60 34 C60 50 44 60 30 64 C16 60 0 50 0 34 Z" fill="#d6001c" stroke="#fff" stroke-width="3"/>
      <text x="30" y="38" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="26" fill="#fff">mm</text>
    </g>
  </g>

  <!-- ───────────── BOOT (front left) ───────────── -->
  <g filter="url(#drop)" transform="translate(80 400)">
    <!-- shaft -->
    <path d="M40 0 L170 0 L176 200 C210 214 270 226 300 250 C312 262 314 290 300 300 L24 300 C10 300 6 280 12 260 L22 120 Z" fill="url(#leather)" stroke="#000" stroke-width="3"/>
    <!-- top cuff -->
    <path d="M36 0 L174 0 L172 30 L38 34 Z" fill="#d6001c"/>
    <!-- shin plate -->
    <path d="M120 40 L168 38 L172 190 C150 196 128 190 118 180 Z" fill="url(#armor)"/>
    <!-- buckles -->
    <rect x="30" y="80" width="90" height="16" rx="4" fill="#9a9aa0"/>
    <rect x="28" y="130" width="92" height="16" rx="4" fill="#9a9aa0"/>
    <!-- ankle red panel -->
    <path d="M30 170 C70 160 110 170 140 196 L120 236 C90 220 60 216 26 222 Z" fill="url(#red)"/>
    <!-- toe slider -->
    <path d="M230 232 C260 236 292 250 302 270 L300 286 L238 276 Z" fill="#cfcfd4"/>
    <!-- sole -->
    <path d="M12 292 L304 292 C312 300 310 314 300 318 L20 318 C8 318 4 304 12 292 Z" fill="#050505"/>
    <!-- heel -->
    <path d="M14 300 L80 300 L80 318 L20 318 Z" fill="#d6001c"/>
    <!-- shine -->
    <path d="M56 40 L70 40 L60 260 L48 260 Z" fill="url(#shine)" opacity="0.2"/>
  </g>

  <!-- ───────────── GLOVE (front right) ───────────── -->
  <g filter="url(#drop)" transform="translate(600 350) rotate(14 120 160) scale(0.95)">
    <!-- cuff -->
    <path d="M40 260 L190 260 L200 350 L30 350 Z" fill="#141416" stroke="#000" stroke-width="3"/>
    <path d="M34 312 L196 312 L198 330 L32 330 Z" fill="#d6001c"/>
    <!-- palm/back -->
    <path d="M40 262 L30 140 C28 118 56 112 62 136 L66 90 L70 40 C72 18 102 18 104 40 L108 82 L112 22 C114 0 146 0 148 22 L150 84 L156 34 C158 12 190 14 190 36 L190 110 L196 100 C204 80 236 88 228 112 L192 220 L190 262 Z" fill="url(#leather)" stroke="#000" stroke-width="3"/>
    <!-- knuckle armor -->
    <path d="M64 118 C80 96 170 96 190 114 L188 160 C160 172 92 172 66 160 Z" fill="url(#armor)" stroke="#000" stroke-width="2"/>
    <path d="M80 130 L176 128" stroke="#d6001c" stroke-width="6" stroke-linecap="round"/>
    <!-- finger sliders -->
    <rect x="76" y="40" width="22" height="34" rx="8" fill="#d6001c"/>
    <rect x="118" y="28" width="22" height="40" rx="8" fill="#d6001c"/>
    <rect x="162" y="44" width="20" height="34" rx="8" fill="#d6001c"/>
    <!-- back stripe -->
    <path d="M70 190 L190 186 L190 204 L72 208 Z" fill="#fff" opacity="0.85"/>
  </g>

  <!-- ───────────── DISCOUNT TAG ───────────── -->
  <g filter="url(#drop)" transform="translate(70 70) rotate(-12)">
    <path d="M0 30 L30 0 L170 0 L170 100 L30 100 L0 70 Z" fill="#d6001c"/>
    <circle cx="26" cy="50" r="9" fill="#0a0a0a"/>
    <path d="M26 50 C10 30 -10 10 -20 -20" stroke="#ddd" stroke-width="3" fill="none"/>
    <text x="104" y="60" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="25" fill="#fff">OFERTAS</text>
  </g>

  <!-- ───────────── ORIGINAL SEAL ───────────── -->
  <g filter="url(#drop)" transform="translate(780 120) rotate(10)">
    <circle r="96" fill="#0a0a0a" stroke="#d6001c" stroke-width="6"/>
    <circle r="80" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="3 5"/>
    <text font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="13.5" letter-spacing="1.6" fill="#fff">
      <textPath href="#sealText" startOffset="0">BLACK FRIDAY · MOTOMUNDI · 2026 ·</textPath>
    </text>
    <circle r="50" fill="#d6001c"/>
    <text y="-6" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="22" fill="#fff">BLACK</text>
    <text y="18" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="17" fill="#fff" fill-opacity="0.85">FRIDAY</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
