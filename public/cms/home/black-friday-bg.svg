<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="glow" cx="72%" cy="45%" r="60%">
      <stop offset="0" stop-color="#5a0010"/>
      <stop offset="0.45" stop-color="#1c0306"/>
      <stop offset="1" stop-color="#070707"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d6001c" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#d6001c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff3b4f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streakW" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="carbon" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="none"/>
      <rect width="8" height="8" fill="#ffffff" opacity="0.025"/>
      <rect x="8" y="8" width="8" height="8" fill="#ffffff" opacity="0.025"/>
    </pattern>

    <!-- Gear outline icons (original drawings) -->
    <g id="i-helmet" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M8 62 C4 30 28 6 62 6 C92 6 112 28 112 56 L112 70 C112 80 104 86 94 86 L30 86 C18 86 10 78 8 62 Z"/>
      <path d="M58 30 L108 30 C112 40 112 50 108 56 L66 56 C58 56 54 48 58 30 Z"/>
      <path d="M30 86 L34 70 L60 70"/>
    </g>
    <g id="i-glove" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M24 104 L20 52 C20 46 30 44 32 52 L34 30 C34 22 46 22 46 30 L48 20 C48 12 60 12 60 20 L62 26 C62 18 74 18 74 26 L76 54 L86 44 C92 38 100 46 94 54 L76 84 L74 104 Z"/>
      <path d="M32 54 L70 54"/>
    </g>
    <g id="i-boot" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M30 6 L70 6 L68 66 C80 70 104 76 110 88 L112 100 L18 100 L20 70 Z"/>
      <path d="M26 30 L68 30 M24 50 L68 50"/>
    </g>
    <g id="i-jacket" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M40 8 L60 18 L80 8 L104 20 L116 80 L100 84 L94 50 L94 108 L26 108 L26 50 L20 84 L4 80 L16 20 Z"/>
      <path d="M60 18 L60 108"/>
    </g>
    <pattern id="gear" width="360" height="300" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <use xlink:href="#i-helmet" transform="translate(20 20) scale(0.7)"/>
      <use xlink:href="#i-glove" transform="translate(200 30) scale(0.7)"/>
      <use xlink:href="#i-boot" transform="translate(110 170) scale(0.7)"/>
      <use xlink:href="#i-jacket" transform="translate(270 160) scale(0.7)"/>
    </pattern>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="900" fill="url(#glow)"/>
  <rect width="1920" height="900" fill="url(#carbon)"/>
  <rect width="1920" height="900" fill="url(#gear)" opacity="0.06"/>

  <!-- Big diagonal slashes -->
  <g opacity="0.9">
    <polygon points="1180,0 1420,0 980,900 740,900" fill="#d6001c" opacity="0.10"/>
    <polygon points="1460,0 1530,0 1090,900 1020,900" fill="#d6001c" opacity="0.22"/>
    <polygon points="1580,0 1600,0 1160,900 1140,900" fill="#ffffff" opacity="0.06"/>
  </g>

  <!-- Speed streaks -->
  <g>
    <rect x="-100" y="160" width="900" height="3" fill="url(#streak)"/>
    <rect x="300" y="210" width="700" height="2" fill="url(#streakW)"/>
    <rect x="-50" y="690" width="1100" height="4" fill="url(#streak)"/>
    <rect x="500" y="740" width="800" height="2" fill="url(#streakW)"/>
    <rect x="1100" y="110" width="900" height="3" fill="url(#streak)"/>
    <rect x="1300" y="820" width="700" height="2" fill="url(#streakW)"/>
  </g>

  <!-- Giant outlined "%" watermark -->
  <g fill="none" stroke="#d6001c" stroke-width="6" opacity="0.18">
    <circle cx="1560" cy="250" r="90"/>
    <circle cx="1760" cy="650" r="90"/>
    <line x1="1830" y1="160" x2="1490" y2="740" stroke-width="40"/>
  </g>

  <!-- Vignette -->
  <rect width="1920" height="900" fill="url(#fadeL)" opacity="0.55"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
